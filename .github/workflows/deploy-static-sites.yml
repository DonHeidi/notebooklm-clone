# Static site deploy — manual trigger (workflow_dispatch) for the prototype.
#
# Builds apps/docs and apps/marketing and syncs their dist/ to the Scaleway
# object-storage website buckets (S3-compatible endpoint). The bucket-website
# configuration itself lives in Terraform (infrastructure/main.tf); objects
# are uploaded with --acl public-read, which bucket websites require.
#
# Default website endpoints (Edge Services / custom domains are session B3):
#   docs:      https://marginalia-docs.s3-website.fr-par.scw.cloud
#   marketing: https://marginalia-marketing.s3-website.fr-par.scw.cloud
#
# Secrets used (names only): SCW_ACCESS_KEY, SCW_SECRET_KEY (the aws CLI
# reads them via the AWS_* variables below).
name: deploy-static-sites

on:
  workflow_dispatch:

concurrency:
  group: deploy-static-sites
  cancel-in-progress: false

env:
  AWS_ACCESS_KEY_ID: ${{ secrets.SCW_ACCESS_KEY }}
  AWS_SECRET_ACCESS_KEY: ${{ secrets.SCW_SECRET_KEY }}
  AWS_DEFAULT_REGION: fr-par
  S3_ENDPOINT: https://s3.fr-par.scw.cloud

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: jdx/mise-action@v4
        with:
          install_args: bun

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Build docs
        run: bun run --filter '@notebooklm-clone/docs' build

      - name: Build marketing
        run: bun run --filter '@notebooklm-clone/marketing' build

      - name: Sync docs bucket
        run: |
          aws s3 sync apps/docs/dist "s3://marginalia-docs" \
            --delete --acl public-read --endpoint-url "$S3_ENDPOINT"

      - name: Sync marketing bucket
        run: |
          aws s3 sync apps/marketing/dist "s3://marginalia-marketing" \
            --delete --acl public-read --endpoint-url "$S3_ENDPOINT"

      - name: Report endpoints
        run: |
          {
            echo "### deploy-static-sites"
            echo "- docs: https://marginalia-docs.s3-website.fr-par.scw.cloud"
            echo "- marketing: https://marginalia-marketing.s3-website.fr-par.scw.cloud"
          } >> "$GITHUB_STEP_SUMMARY"
