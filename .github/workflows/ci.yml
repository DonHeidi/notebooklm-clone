# CI — runs on every PR and on pushes to main (session B2).
#
# Tool versions come from mise.toml (single source of truth); jdx/mise-action
# installs Bun and Terraform from it. The webapp build needs the two
# NEXT_PUBLIC_SUPABASE_* variables to exist at build time; CI provides
# obviously-fake BUILD-TIME PLACEHOLDERS (never real values — CI only checks
# that the build compiles, the resulting artifacts are thrown away).
name: ci

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    name: lint · typecheck · test · build
    runs-on: ubuntu-latest
    services:
      # DB-backed tests run against real Postgres + pgvector (feasibility
      # D-9). A plain pgvector image instead of the full `supabase start`
      # stack: one ~150 MB pull vs ~8 GB across 13 containers, and the tests
      # apply the supabase/migrations timeline themselves either way. pg17
      # matches supabase/config.toml major_version. The credentials are
      # throwaway (container dies with the job, never reachable externally).
      postgres:
        image: pgvector/pgvector:pg17
        env:
          POSTGRES_PASSWORD: postgres
        ports:
          - 54329:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 2s
          --health-timeout 5s
          --health-retries 15
    env:
      NEXT_TELEMETRY_DISABLED: "1"
      # Build-time placeholders (see header comment) — not real endpoints.
      NEXT_PUBLIC_SUPABASE_URL: https://ci-build-placeholder.supabase.co
      NEXT_PUBLIC_SUPABASE_ANON_KEY: ci-build-placeholder-anon-key
      TEST_DATABASE_URL: postgres://postgres:postgres@127.0.0.1:54329/postgres
    steps:
      - uses: actions/checkout@v7

      - uses: jdx/mise-action@v4
        with:
          install_args: bun

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Lint (webapp)
        run: bun run --filter '@notebooklm-clone/webapp' lint

      - name: Typecheck (webapp)
        working-directory: apps/webapp
        run: |
          node_modules/.bin/next typegen
          node_modules/.bin/tsc --noEmit

      - name: Test
        run: bun test

      - name: Build all apps
        run: bun run build

  terraform:
    name: terraform fmt + validate
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: infrastructure
    steps:
      - uses: actions/checkout@v7

      - uses: jdx/mise-action@v4
        with:
          install_args: terraform

      - name: terraform fmt -check
        run: terraform fmt -check -recursive

      - name: terraform validate
        # -backend=false: validation needs no state and no cloud credentials.
        run: |
          terraform init -backend=false -input=false
          terraform validate
