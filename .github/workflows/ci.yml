# CI — runs on every PR and on pushes to main (session B2).
#
# Tool versions come from mise.toml (single source of truth); jdx/mise-action
# installs Bun and Terraform from it. The webapp build needs the two
# NEXT_PUBLIC_SUPABASE_* variables to exist at build time; CI provides
# obviously-fake BUILD-TIME PLACEHOLDERS (never real values — CI only checks
# that the build compiles, the resulting artifacts are thrown away).
name: ci

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    name: lint · typecheck · test · build
    runs-on: ubuntu-latest
    env:
      NEXT_TELEMETRY_DISABLED: "1"
      # Build-time placeholders (see header comment) — not real endpoints.
      NEXT_PUBLIC_SUPABASE_URL: https://ci-build-placeholder.supabase.co
      NEXT_PUBLIC_SUPABASE_ANON_KEY: ci-build-placeholder-anon-key
    steps:
      - uses: actions/checkout@v7

      - uses: jdx/mise-action@v4
        with:
          install_args: bun

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Lint (webapp)
        run: bun run --filter '@notebooklm-clone/webapp' lint

      - name: Typecheck (webapp)
        working-directory: apps/webapp
        run: |
          node_modules/.bin/next typegen
          node_modules/.bin/tsc --noEmit

      - name: Test
        # Known quirk (B2, 2026-08-18): any test that instantiates PGlite makes
        # the Bun process exit 99 even when every test passes — the identical
        # code exits 0 under Node, and closing the client doesn't help
        # (Bun 1.3.14 + @electric-sql/pglite 0.5.5, both current). Until
        # upstream fixes it, accept EXACTLY that signature: exit code 99 with
        # a "0 fail" summary. Any other nonzero exit still fails the job
        # (bun test's exit code is the failure count, so 99 real failures
        # would print "99 fail" and not match).
        run: |
          set +e
          bun test 2>&1 | tee bun-test.log
          code=${PIPESTATUS[0]}
          set -e
          if [ "$code" = "0" ]; then exit 0; fi
          if [ "$code" = "99" ] && grep -qE ' 0 fail' bun-test.log; then
            echo "::warning::bun test exited 99 with 0 failures (PGlite/Bun quirk) — treated as pass"
            exit 0
          fi
          exit "$code"

      - name: Build all apps
        run: bun run build

  terraform:
    name: terraform fmt + validate
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: infrastructure
    steps:
      - uses: actions/checkout@v7

      - uses: jdx/mise-action@v4
        with:
          install_args: terraform

      - name: terraform fmt -check
        run: terraform fmt -check -recursive

      - name: terraform validate
        # -backend=false: validation needs no state and no cloud credentials.
        run: |
          terraform init -backend=false -input=false
          terraform validate
