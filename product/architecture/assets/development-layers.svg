.93" y="207.8569">Owner always re-derived from the</text><text fill="#000000" font-family="Verdana" font-size="13" lengthAdjust="spacing" textLength="195.8188" x="281.93" y="222.9897">verified JWT (requireUser()) &#8212;</text><text fill="#000000" font-family="Verdana" font-size="13" lengthAdjust="spacing" textLength="211.3008" x="281.93" y="238.1225">the proxy is never the authority.</text></g><g class="entity" data-qualified-name="GMN16" data-source-line="29" id="ent0017"><path d="M274.86,435.67 L274.86,474.51 L231.99,478.51 L274.86,482.51 L274.86,521.3341 A0,0 0 0 0 274.86,521.3341 L536.671,521.3341 A0,0 0 0 0 536.671,521.3341 L536.671,445.67 L526.671,435.67 L274.86,435.67 A0,0 0 0 0 274.86,435.67" fill="#FFFFFF" style="stroke:#000000;stroke-width:1;"/><path d="M526.671,435.67 L526.671,445.67 L536.671,445.67 L526.671,435.67" fill="#FFFFFF" style="stroke:#000000;stroke-width:1;"/><text fill="#000000" font-family="Verdana" font-size="13" lengthAdjust="spacing" textLength="211.0786" x="280.86" y="452.7369">The ONLY layer that touches db.</text><text fill="#000000" font-family="Verdana" font-size="13" lengthAdjust="spacing" textLength="240.811" x="280.86" y="467.8697">Factory functions taking Database &#8212;</text><text fill="#000000" font-family="Verdana" font-size="13" lengthAdjust="spacing" textLength="208.2285" x="280.86" y="483.0025">tests inject PGlite (real Postgres</text><text fill="#000000" font-family="Verdana" font-size="13" lengthAdjust="spacing" textLength="228.1919" x="280.86" y="498.1353">pending, D-9). Every method takes</text><text fill="#000000" font-family="Verdana" font-size="13" lengthAdjust="spacing" textLength="188.354" x="280.86" y="513.2681">and applies ownerId (SEC-5).</text></g><!--link View to URL--><g class="link" data-entity-1="ent0002" data-entity-2="ent0003" data-link-type="dependency" data-source-line="16" id="lnk8"><path d="M139.77,115.08 C139.77,133.33 139.77,151.07 139.77,170.48" fill="none" id="View-to-URL" style="stroke:#000000;